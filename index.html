.btn-gold{background:var(--gold);color:#fff;border:0}.btn-gold:hover{background:#a97b1d;color:#fff}
.hero{color:#fff;border-radius:16px;padding:30px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(20,50,92,.96),rgba(43,90,155,.92)),repeating-linear-gradient(45deg,#c9962b 0 6px,transparent 6px 18px)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:18px solid rgba(201,150,43,.35)}
.card{border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.2)!important}
.ph{height:130px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.chip{border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:3px 12px;text-decoration:none;font-size:.85rem;margin:0 6px 6px 0;display:inline-block}.chip:hover{background:var(--gold);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}.cal b{font-size:.7rem;text-align:center;padding:5px 0;border-radius:6px;color:#fff;font-weight:500}
.ok{background:#2e9e5b}.no{background:#c0392b}
.bar{background:linear-gradient(90deg,var(--gold),#e6b84f);color:#222;border-radius:6px;padding:2px 8px;font-size:.8rem;min-width:70px;white-space:nowrap}
#app{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px}
#toast div{background:var(--blue);color:#fff;padding:10px 18px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media print{.navbar,footer,.no-print,#toast{display:none!important}}
body{font-family:Inter,system-ui,sans-serif}[data-bs-theme=light] body{background:#f7f4ee}
h2,h3,h5,.navbar-brand{font-family:'Playfair Display',Georgia,serif}.navbar-brand:before{content:"✦ ";color:var(--gold)}
.hero h2{font-size:2.1rem}.card{position:relative;border:0;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ph{position:relative;height:160px;align-items:flex-end;justify-content:flex-start;padding:8px 12px;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;background-color:#14325c}
.price{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:20px;padding:3px 11px;font-size:.78rem;text-transform:none;letter-spacing:0}
.sec{border:0;height:8px;opacity:.7;border-radius:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 16px)}
.step{padding:18px}.step i{font-style:normal;font-size:2.2rem;display:block}
</style></head><body>
